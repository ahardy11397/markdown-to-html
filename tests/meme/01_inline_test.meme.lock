      "canonical_meme": "use md_inline\ntest escape_html_test:\n    define res: String as escape_html(\"Tom & Jerry <friends> > enemies\")\n    assert res == \"Tom &amp; Jerry &lt;friends&gt; &gt; enemies\"\ntest code_span_test:\n    define res: String as render_inline(\"`code < > &`\")\n    assert res == \"<code>code &lt; &gt; &amp;</code>\"\ntest bold_test:\n    define res: String as render_inline(\"**bold text**\")\n    assert res == \"<strong>bold text</strong>\"\ntest italic_test:\n    define res: String as render_inline(\"*italic text*\")\n    assert res == \"<em>italic text</em>\"\ntest link_test:\n    define res: String as render_inline(\"[Google](https://google.com)\")\n    assert res == \"<a href=\\\"https://google.com\\\">Google</a>\"\ntest combos_test:\n    define res: String as render_inline(\"**bold and *italic* and `code`**\")\n    assert res == \"<strong>bold and <em>italic</em> and <code>code</code></strong>\"\ntest html_injection_test:\n    define res: String as render_inline(\"<script>alert('xss')</script>\")\n    assert res == \"&lt;script&gt;alert('xss')&lt;/script&gt;\"\ntest unclosed_markup_test:\n    define res: String as render_inline(\"Just * one star and ** two stars and ` one backtick and [one bracket\")\n    assert res == \"Just * one star and ** two stars and ` one backtick and [one bracket\"\ntest link_with_markup_test:\n    define res: String as render_inline(\"[**Bold link**](https://example.com)\")\n    assert res == \"<a href=\\\"https://example.com\\\"><strong>Bold link</strong></a>\"",
