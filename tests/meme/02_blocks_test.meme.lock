      "canonical_meme": "use md_block\ntest heading_level_test:\n    assert get_heading_level(\"# Heading 1\") == 1\n    assert get_heading_level(\"## Heading 2\") == 2\n    assert get_heading_level(\"### Heading 3\") == 3\n    assert get_heading_level(\"#### Heading 4\") == 4\n    assert get_heading_level(\"##### Heading 5\") == 5\n    assert get_heading_level(\"###### Heading 6\") == 6\n    assert get_heading_level(\"#NoSpace\") == 0\n    assert get_heading_level(\"####### Seven\") == 0\ntest hr_test:\n    assert is_hr(\"---\") == true\n    assert is_hr(\"-----\") == true\n    assert is_hr(\"--\") == false\n    assert is_hr(\"- item\") == false\ntest parse_headings_test:\n    define list b as parse_blocks(\"# Level 1\\n## Level 2\")\n    assert length of b == 2\n    assert b[0].kind == \"heading\"\n    assert b[0].level == 1\n    assert b[0].content == \"Level 1\"\n    assert b[1].kind == \"heading\"\n    assert b[1].level == 2\n    assert b[1].content == \"Level 2\"\ntest parse_code_fence_test:\n    define content: String as \"```python\\ndef foo():\\n    return 42\\n```\"\n    define list b as parse_blocks(content)\n    assert length of b == 1\n    assert b[0].kind == \"code\"\n    assert length of b[0].lines == 2\n    assert b[0].lines[0] == \"def foo():\"\n    assert b[0].lines[1] == \"    return 42\"\ntest parse_lists_test:\n    define content: String as \"- Item 1\\n- Item 2\\n\\n1. First\\n2. Second\"\n    define list b as parse_blocks(content)\n    assert length of b == 2\n    assert b[0].kind == \"ul\"\n    assert length of b[0].lines == 2\n    assert b[0].lines[0] == \"Item 1\"\n    assert b[0].lines[1] == \"Item 2\"\n    assert b[1].kind == \"ol\"\n    assert length of b[1].lines == 2\n    assert b[1].lines[0] == \"First\"\n    assert b[1].lines[1] == \"Second\"\ntest parse_blockquote_test:\n    define content: String as \"> Line 1\\n> Line 2\"\n    define list b as parse_blocks(content)\n    assert length of b == 1\n    assert b[0].kind == \"blockquote\"\n    assert length of b[0].lines == 2\n    assert b[0].lines[0] == \"Line 1\"\n    assert b[0].lines[1] == \"Line 2\"\ntest parse_paragraphs_test:\n    define content: String as \"Para 1 line 1\\nPara 1 line 2\\n\\nPara 2\"\n    define list b as parse_blocks(content)\n    assert length of b == 2\n    assert b[0].kind == \"paragraph\"\n    assert length of b[0].lines == 2\n    assert b[0].lines[0] == \"Para 1 line 1\"\n    assert b[0].lines[1] == \"Para 1 line 2\"\n    assert b[1].kind == \"paragraph\"\n    assert length of b[1].lines == 1\n    assert b[1].lines[0] == \"Para 2\"\ntest parse_hr_test:\n    define content: String as \"Before\\n---\\nAfter\"\n    define list b as parse_blocks(content)\n    assert length of b == 3\n    assert b[0].kind == \"paragraph\"\n    assert b[1].kind == \"hr\"\n    assert b[2].kind == \"paragraph\"\ntest parse_empty_test:\n    define list b as parse_blocks(\"\")\n    assert length of b == 0",
