      "canonical_meme": "use md_inline\nuse md_block\nfunction render_block(b: Block) -> String:\n    if b.kind == \"heading\":\n        define lvl_str: String as text of b.level\n        define inner: String as render_inline(b.content)\n        return \"<h\" + lvl_str + \">\" + inner + \"</h\" + lvl_str + \">\"\n    if b.kind == \"code\":\n        define list code_lines as b.lines\n        define joined_code: String as join code_lines with \"\\n\"\n        define escaped_code: String as escape_html(joined_code)\n        return \"<pre><code>\" + escaped_code + \"</code></pre>\"\n    if b.kind == \"hr\":\n        return \"<hr />\"\n    if b.kind == \"blockquote\":\n        define list quote_lines as b.lines\n        define out: String as \"<blockquote>\"\n        define first: Bool as true\n        for each line in quote_lines:\n            if not first:\n                set out to out + \"<br />\"\n            set out to out + render_inline(line)\n            set first to false\n        set out to out + \"</blockquote>\"\n        return out\n    if b.kind == \"ul\":\n        define list ul_items as b.lines\n        define out: String as \"<ul>\"\n        for each item in ul_items:\n            set out to out + \"<li>\" + render_inline(item) + \"</li>\"\n        set out to out + \"</ul>\"\n        return out\n    if b.kind == \"ol\":\n        define list ol_items as b.lines\n        define out: String as \"<ol>\"\n        for each item in ol_items:\n            set out to out + \"<li>\" + render_inline(item) + \"</li>\"\n        set out to out + \"</ol>\"\n        return out\n    if b.kind == \"paragraph\":\n        define list para_lines as b.lines\n        define joined: String as join para_lines with \" \"\n        define inner: String as render_inline(joined)\n        return \"<p>\" + inner + \"</p>\"\n    return \"\"\nfunction render_markdown(content: String) -> String:\n    define list blocks as parse_blocks(content)\n    if length of blocks == 0:\n        return \"\"\n    define list html_parts as empty List<String>\n    for each b in blocks:\n        append render_block(b) to html_parts\n    return join html_parts with \"\\n\"\nfunction get_tokens(content: String) -> List<String>:\n    define list blocks as parse_blocks(content)\n    define list tokens as empty List<String>\n    for each b in blocks:\n        if b.kind == \"heading\":\n            append \"heading \" + text of b.level to tokens\n        else:\n            if b.kind == \"code\":\n                append \"code\" to tokens\n            else:\n                if b.kind == \"hr\":\n                    append \"hr\" to tokens\n                else:\n                    if b.kind == \"blockquote\":\n                        append \"blockquote\" to tokens\n                    else:\n                        if b.kind == \"ul\" or b.kind == \"ol\":\n                            define list list_items as b.lines\n                            for each item in list_items:\n                                append \"list-item\" to tokens\n                        else:\n                            if b.kind == \"paragraph\":\n                                append \"paragraph\" to tokens\n    return tokens",
