      "canonical_meme": "use md_inline\nuse md_block\nuse md_render\ntest missing_file_clean_error_test:\n    define path: String as \"definitely_nonexistent_file_98765.md\"\n    define content_opt: Optional<String> as read string from file path or else nothing\n    assert content_opt is nothing\ntest file_render_and_cleanup_test:\n    define in_path: String as \"scratch_test_input.md\"\n    define out_path: String as \"scratch_test_output.html\"\n    define md_text: String as \"# Document Title\\n\\n- Item with **bold**\\n- Item with `code`\\n\\nParagraph text.\"\n    write file in_path with md_text\n    define loaded_opt: Optional<String> as read string from file in_path or else nothing\n    assert loaded_opt is not nothing\n    define loaded: String as value of loaded_opt\n    define html: String as render_markdown(loaded)\n    write file out_path with html\n    define saved_opt: Optional<String> as read string from file out_path or else nothing\n    assert saved_opt is not nothing\n    define saved: String as value of saved_opt\n    define expected: String as \"<h1>Document Title</h1>\\n<ul><li>Item with <strong>bold</strong></li><li>Item with <code>code</code></li></ul>\\n<p>Paragraph text.</p>\"\n    assert saved == expected\n    delete file in_path\n    delete file out_path\n    assert not file exists in_path\n    assert not file exists out_path",
