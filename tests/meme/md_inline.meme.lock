      "canonical_meme": "record LinkMatch:\n    found: Bool\n    split_pos: Int\n    end_pos: Int\nfunction escape_html(s: String) -> String:\n    define s1: String as replace \"&\" with \"&amp;\" in s\n    define s2: String as replace \"<\" with \"&lt;\" in s1\n    define s3: String as replace \">\" with \"&gt;\" in s2\n    return s3\nfunction find_closing_backtick(s: String, start_pos: Int) -> Int:\n    define len: Int as length of string s\n    if start_pos >= len:\n        return -1\n    for k from start_pos to len - 1:\n        if char at k of s == \"`\":\n            return k\n    return -1\nfunction find_closing_triple_star(s: String, start_pos: Int) -> Int:\n    define len: Int as length of string s\n    if start_pos + 2 >= len:\n        return -1\n    for k from start_pos to len - 3:\n        if slice s from k to k + 3 == \"***\":\n            return k\n    return -1\nfunction find_closing_double_star(s: String, start_pos: Int) -> Int:\n    define len: Int as length of string s\n    if start_pos + 1 >= len:\n        return -1\n    for k from start_pos to len - 2:\n        if slice s from k to k + 2 == \"**\":\n            return k\n    return -1\nfunction find_closing_single_star(s: String, start_pos: Int) -> Int:\n    define len: Int as length of string s\n    if start_pos >= len:\n        return -1\n    for k from start_pos to len - 1:\n        if char at k of s == \"*\":\n            define is_double: Bool as false\n            if k > 0:\n                if char at (k - 1) of s == \"*\":\n                    set is_double to true\n            if k + 1 < len:\n                if char at (k + 1) of s == \"*\":\n                    set is_double to true\n            if not is_double:\n                return k\n    return -1\nfunction find_link(s: String, start_pos: Int) -> LinkMatch:\n    define len: Int as length of string s\n    if start_pos + 4 > len:\n        return LinkMatch(found=false, split_pos=-1, end_pos=-1)\n    for k from start_pos + 1 to len - 3:\n        if slice s from k to k + 2 == \"](\":\n            for m from k + 2 to len - 1:\n                if char at m of s == \")\":\n                    return LinkMatch(found=true, split_pos=k, end_pos=m)\n    return LinkMatch(found=false, split_pos=-1, end_pos=-1)\nfunction render_inline_escaped(s: String) -> String:\n    define len: Int as length of string s\n    define out: String as \"\"\n    define i: Int as 0\n    while i < len:\n        define ch: String as char at i of s\n        if ch == \"`\":\n            define close_idx: Int as find_closing_backtick(s, i + 1)\n            if close_idx != -1:\n                define inner: String as slice s from i + 1 to close_idx\n                set out to out + \"<code>\" + inner + \"</code>\"\n                set i to close_idx + 1\n            else:\n                set out to out + \"`\"\n                set i to i + 1\n        else:\n            if ch == \"[\":\n                define lm: LinkMatch as find_link(s, i)\n                if lm.found:\n                    define link_text: String as slice s from i + 1 to lm.split_pos\n                    define link_url: String as slice s from lm.split_pos + 2 to lm.end_pos\n                    define rendered_text: String as render_inline_escaped(link_text)\n                    set out to out + \"<a href=\\\"\" + link_url + \"\\\">\" + rendered_text + \"</a>\"\n                    set i to lm.end_pos + 1\n                else:\n                    set out to out + \"[\"\n                    set i to i + 1\n            else:\n                if i + 2 < len and slice s from i to i + 3 == \"***\":\n                    define close_idx: Int as find_closing_triple_star(s, i + 3)\n                    if close_idx != -1:\n                        define inner: String as slice s from i + 3 to close_idx\n                        define rendered_inner: String as render_inline_escaped(inner)\n                        set out to out + \"<strong><em>\" + rendered_inner + \"</em></strong>\"\n                        set i to close_idx + 3\n                    else:\n                        set out to out + \"***\"\n                        set i to i + 3\n                else:\n                    if i + 1 < len and slice s from i to i + 2 == \"**\":\n                        define close_idx: Int as find_closing_double_star(s, i + 2)\n                        if close_idx != -1:\n                            define inner: String as slice s from i + 2 to close_idx\n                            define rendered_inner: String as render_inline_escaped(inner)\n                            set out to out + \"<strong>\" + rendered_inner + \"</strong>\"\n                            set i to close_idx + 2\n                        else:\n                            set out to out + \"**\"\n                            set i to i + 2\n                    else:\n                        if ch == \"*\":\n                            define close_idx: Int as find_closing_single_star(s, i + 1)\n                            if close_idx != -1:\n                                define inner: String as slice s from i + 1 to close_idx\n                                define rendered_inner: String as render_inline_escaped(inner)\n                                set out to out + \"<em>\" + rendered_inner + \"</em>\"\n                                set i to close_idx + 1\n                            else:\n                                set out to out + \"*\"\n                                set i to i + 1\n                        else:\n                            set out to out + ch\n                            set i to i + 1\n    return out\nfunction render_inline(raw_text: String) -> String:\n    define escaped: String as escape_html(raw_text)\n    return render_inline_escaped(escaped)",
