      "canonical_meme": "record Block:\n    kind: String\n    content: String\n    level: Int\n    lines: List<String>\nfunction get_heading_level(line: String) -> Int:\n    define len: Int as length of string line\n    if len < 2:\n        return 0\n    define i: Int as 0\n    while i < len and char at i of line == \"#\":\n        set i to i + 1\n    if i >= 1 and i <= 6:\n        if i < len and char at i of line == \" \":\n            return i\n    return 0\nfunction is_code_fence(line: String) -> Bool:\n    return line starts with \"```\"\nfunction is_hr(line: String) -> Bool:\n    define trimmed: String as trim line\n    define len: Int as length of string trimmed\n    if len < 3:\n        return false\n    for k from 0 to len - 1:\n        if char at k of trimmed != \"-\":\n            return false\n    return true\nfunction is_unordered_list_item(line: String) -> Bool:\n    return line starts with \"- \"\nfunction get_ordered_list_prefix_len(line: String) -> Int:\n    define len: Int as length of string line\n    if len < 3:\n        return 0\n    define dot_space_idx: Int as index of \". \" in line\n    if dot_space_idx <= 0:\n        return 0\n    for k from 0 to dot_space_idx - 1:\n        define ch: String as char at k of line\n        if not is digit ch:\n            return 0\n    return dot_space_idx + 2\nfunction is_blockquote_line(line: String) -> Bool:\n    if line starts with \"> \":\n        return true\n    if line == \">\":\n        return true\n    return false\nfunction create_block_if_any(kind: String, lines: List<String>) -> Optional<Block>:\n    if length of lines == 0:\n        return nothing\n    if kind == \"paragraph\":\n        return optional Block(kind=\"paragraph\", content=\"\", level=0, lines=lines)\n    if kind == \"blockquote\":\n        return optional Block(kind=\"blockquote\", content=\"\", level=0, lines=lines)\n    if kind == \"ul\":\n        return optional Block(kind=\"ul\", content=\"\", level=0, lines=lines)\n    if kind == \"ol\":\n        return optional Block(kind=\"ol\", content=\"\", level=0, lines=lines)\n    return nothing\nfunction parse_blocks(content: String) -> List<Block>:\n    define clean_content: String as replace \"\\r\" with \"\" in content\n    if length of string trim clean_content == 0:\n        return empty List<Block>\n    define list raw_lines as split clean_content by \"\\n\"\n    define list blocks as empty List<Block>\n    define list empty_lines as empty List<String>\n    define in_code_block: Bool as false\n    define list code_lines as empty List<String>\n    define current_kind: String as \"\"\n    define list current_lines as empty List<String>\n    for each line in raw_lines:\n        if in_code_block:\n            if is_code_fence(line):\n                set in_code_block to false\n                define cb: Block as Block(kind=\"code\", content=\"\", level=0, lines=code_lines)\n                append cb to blocks\n                set code_lines to empty List<String>\n            else:\n                append line to code_lines\n            continue\n        if is_code_fence(line):\n            define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n            if opt_b is not nothing:\n                append value of opt_b to blocks\n            set current_kind to \"\"\n            set current_lines to empty List<String>\n            set in_code_block to true\n            set code_lines to empty List<String>\n            continue\n        if length of string trim line == 0:\n            define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n            if opt_b is not nothing:\n                append value of opt_b to blocks\n            set current_kind to \"\"\n            set current_lines to empty List<String>\n            continue\n        define h_level: Int as get_heading_level(line)\n        if h_level > 0:\n            define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n            if opt_b is not nothing:\n                append value of opt_b to blocks\n            set current_kind to \"\"\n            set current_lines to empty List<String>\n            define h_text: String as trim slice line from h_level + 1 to length of string line\n            append Block(kind=\"heading\", content=h_text, level=h_level, lines=empty_lines) to blocks\n            continue\n        if is_hr(line):\n            define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n            if opt_b is not nothing:\n                append value of opt_b to blocks\n            set current_kind to \"\"\n            set current_lines to empty List<String>\n            append Block(kind=\"hr\", content=\"\", level=0, lines=empty_lines) to blocks\n            continue\n        if is_unordered_list_item(line):\n            if current_kind != \"ul\":\n                define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n                if opt_b is not nothing:\n                    append value of opt_b to blocks\n                set current_kind to \"ul\"\n                set current_lines to empty List<String>\n            define item_text: String as slice line from 2 to length of string line\n            append item_text to current_lines\n            continue\n        define ol_prefix_len: Int as get_ordered_list_prefix_len(line)\n        if ol_prefix_len > 0:\n            if current_kind != \"ol\":\n                define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n                if opt_b is not nothing:\n                    append value of opt_b to blocks\n                set current_kind to \"ol\"\n                set current_lines to empty List<String>\n            define item_text: String as slice line from ol_prefix_len to length of string line\n            append item_text to current_lines\n            continue\n        if is_blockquote_line(line):\n            if current_kind != \"blockquote\":\n                define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n                if opt_b is not nothing:\n                    append value of opt_b to blocks\n                set current_kind to \"blockquote\"\n                set current_lines to empty List<String>\n            if line starts with \"> \":\n                append slice line from 2 to length of string line to current_lines\n            else:\n                append \"\" to current_lines\n            continue\n        if current_kind != \"paragraph\":\n            define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n            if opt_b is not nothing:\n                append value of opt_b to blocks\n            set current_kind to \"paragraph\"\n            set current_lines to empty List<String>\n        append line to current_lines\n    if in_code_block:\n        append Block(kind=\"code\", content=\"\", level=0, lines=code_lines) to blocks\n    else:\n        define opt_b: Optional<Block> as create_block_if_any(current_kind, current_lines)\n        if opt_b is not nothing:\n            append value of opt_b to blocks\n    return blocks",
